name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Install Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Type check
        run: uv run mypy src/
      - name: Unit tests
        run: uv run pytest
      - name: Doctest
        run: uv run python -m doctest src/japan_life/utils.py
